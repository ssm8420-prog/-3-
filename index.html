<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f38">
  <title>차곡 · 나의 문제은행</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="차곡 홈"><span class="brand-mark">▥</span> 차곡<span class="brand-en">QUESTION BANK</span></a>
    <div class="sidebar-label">나의 학습 공간</div>
    <nav aria-label="주 메뉴">
      <button data-view="library" class="nav active"><span>▦</span> 문제 보관함</button>
      <button data-view="review" class="nav"><span>↺</span> 오답 · 북마크</button>
      <button data-view="history" class="nav"><span>▤</span> 학습 기록</button>
      <button data-view="theories" class="nav"><span>▧</span> 이론 보관함</button>
    </nav>
    <div class="sidebar-foot"><span class="status-dot"></span> 이 브라우저에 학습 기록 저장<br><small>다른 기기와 자동 동기화되지 않아요.</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span>나의 문제은행 <span class="muted">/</span> <span id="breadcrumb">문제 보관함</span></span><div class="actions"><button id="restore-records" class="button subtle">기록 복원</button><button id="export-records" class="button subtle">기록 내보내기 ↗</button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer>한 문제씩, 차곡차곡 쌓이는 실력.</footer>
  </div>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="image-dialog"><button class="button subtle" id="close-image">닫기 ×</button><img id="large-image" alt=""></dialog>
  <script defer src="data/image-map.js"></script>
  <script defer src="data/bank.js"></script>
  <script defer src="bundle.js"></script>
</body>
</html>
